<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamantes Free Fire - Venta por Saldo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
  }
  header h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #ff8a00, #ffd200, #00e0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  header p { color: #b8b8d1; font-size: 1rem; }
  .aviso {
    background: rgba(255, 138, 0, 0.15);
    border: 1px solid #ff8a00;
    color: #ffd200;
    padding: 12px 20px;
    border-radius: 12px;
    text-align: center;
    max-width: 600px;
    margin: 0 auto 30px;
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 22px 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: #00e0ff;
    box-shadow: 0 12px 30px rgba(0,224,255,0.25);
    background: rgba(0,224,255,0.08);
  }
  .card .icon {
    font-size: 2.2rem;
    margin-bottom: 8px;
    display: block;
  }
  .card .diamantes {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffd200;
  }
  .card .diamantes span { font-size: 0.9rem; color: #b8b8d1; font-weight: 400; }
  .card .precio {
    margin-top: 10px;
    font-size: 1.15rem;
    font-weight: 600;
    color: #00e0ff;
  }
  .card .btn {
    margin-top: 14px;
    display: inline-block;
    background: linear-gradient(90deg, #25D366, #128C7E);
    color: #fff;
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: 0.2s;
  }
  .card:hover .btn { transform: scale(1.05); }
  footer {
    text-align: center;
    margin-top: 40px;
    color: #7a7a99;
    font-size: 0.85rem;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>💎 Diamantes Free Fire</h1>
  <p>Recarga por saldo · Entrega rápida y segura</p>
</header>

<div class="aviso">
  ⚡ Selecciona un paquete y se abrirá WhatsApp con tu pedido listo para enviar.
</div>

<div class="grid" id="catalogo"></div>

<footer>
  © 2025 Diamantes FF · Todos los derechos reservados
</footer>

<script>
  // 👇 CAMBIA ESTE NÚMERO POR EL TUYO (código de país + número, sin + ni espacios)
  const WHATSAPP_NUMERO = "5350000000";

  // Precio base: 110 diamantes = 360 de saldo
  const PRECIO_BASE = 360;
  const DIAMANTES_BASE = 110;

  // Generar paquetes desde 110 hasta 2000 (múltiplos de 110)
  const paquetes = [];
  for (let d = 110; d <= 2000; d += 110) {
    const precio = Math.round((d / DIAMANTES_BASE) * PRECIO_BASE);
    paquetes.push({ diamantes: d, precio: precio });
  }

  const catalogo = document.getElementById("catalogo");

  paquetes.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <span class="icon">💎</span>
      <div class="diamantes">${p.diamantes} <span>diamantes</span></div>
      <div class="precio">$${p.precio} de saldo</div>
      <div class="btn">Pedir por WhatsApp</div>
    `;
    card.addEventListener("click", () => enviarWhatsApp(p.diamantes, p.precio));
    catalogo.appendChild(card);
  });

  function enviarWhatsApp(diamantes, precio) {
    const mensaje = `Hola, quiero comprar *${diamantes} diamantes* de Free Fire por *$${precio} de saldo*. ¿Está disponible?`;
    const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, "_blank");
  }
</script>

</body>
</html>
